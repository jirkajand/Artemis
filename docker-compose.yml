services:

  gateway:
    image: nginx:alpine
    container_name: api-gateway
    command: /bin/sh -c "envsubst '$$USER_MANAGEMENT_PORT $$SETTINGS_SERVICE_PORT $$FRONTEND_PORT' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && nginx -g 'daemon off;'"
    volumes:
      - ./devops/nginx.conf:/etc/nginx/nginx.conf.template:ro
    environment:
      - USER_MANAGEMENT_PORT=${USER_MANAGEMENT_PORT}
      - SETTINGS_SERVICE_PORT=${SETTINGS_SERVICE_PORT}
      - FRONTEND_PORT=${FRONTEND_PORT}
    ports:
      - "${GATEWAY_PORT}:80"
    depends_on:
      - user-management-service
      - settings-service
      - frontend

  artemis-database:
    build:
      context: .
      dockerfile: devops/Dockerfile
    container_name: artemis-database
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - DB_NAMES=${DB_NAMES}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
        - VITE_KEYCLOAK_URL=${VITE_KEYCLOAK_URL}
        - VITE_KEYCLOAK_REALM=${VITE_KEYCLOAK_REALM}
        - VITE_KEYCLOAK_CLIENT_ID=${VITE_KEYCLOAK_CLIENT_ID}
    container_name: frontend
    expose:
      - "${FRONTEND_PORT}"

  user-management-service:
    build:
      context: .
      dockerfile: usermanagement/Dockerfile
    container_name: user-management-service
    ports:
      - "${USER_MANAGEMENT_PORT}:${USER_MANAGEMENT_PORT}"
    environment:
      - SERVER_PORT=${USER_MANAGEMENT_PORT}
      - DB_HOST=artemis-database
      - DB_PORT=5432
      - DB_NAME=user_management_db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
    volumes:
      - ./data/profile-pictures:/data/profile-pictures
    depends_on:
      - artemis-database

  settings-service:
    build:
      context: .
      dockerfile: settings-service/Dockerfile
    container_name: settings-service
    ports:
      - "${SETTINGS_SERVICE_PORT}:${SETTINGS_SERVICE_PORT}"
    environment:
      - SERVER_PORT=${SETTINGS_SERVICE_PORT}
      - DB_HOST=artemis-database
      - DB_PORT=5432
      - DB_NAME=settings_service_db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - INTERNAL_KAFKA_HOST=kafkaInternal
      - INTERNAL_KAFKA_PORT=${INTERNAL_KAFKA_PORT}
    depends_on:
      - artemis-database

  zookeeper:
    image: confluentinc/cp-zookeeper
    container_name: zookeeper
    restart: unless-stopped
    #    ports:
    #      - 22181:2181
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log

  kafkaInternal:
    image: confluentinc/cp-kafka
    container_name: kafkaInternal
    depends_on:
      - zookeeper
    #    ports:
    #      - 29093:29093
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafkaInternal:${INTERNAL_KAFKA_PORT},PLAINTEXT_HOST://localhost:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data

  #### DEVELOPMENT TOOLS - Do not push to prod ####
  #  kafka-ui:
  #    image: provectuslabs/kafka-ui:latest
  #    depends_on:
  #      - kafkaInternal
  #    ports:
  #      - 8100:8080
  #    environment:
  #      KAFKA_CLUSTERS_0_NAME: local
  #      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafkaInternal:${INTERNAL_KAFKA_PORT}
  #      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  kafka-init-topics:
    image: confluentinc/cp-kafka
    container_name: kafka-init-topics
    depends_on:
      - kafkaInternal
    entrypoint: [ "/bin/bash", "-c" ]
    command: |
      "
      echo 'Waiting for Kafka to be ready...';
      sleep 5;
      
      kafka-topics --bootstrap-server kafkaInternal:${INTERNAL_KAFKA_PORT} --create --topic settings.semester --partitions 3 --replication-factor 1 --config cleanup.policy=compact --if-not-exists;
      echo 'Created kafka topics:  setting.semester';
      "

volumes:
  db-data:
  kafka-data:
  zookeeper-data:
  zookeeper-log:
