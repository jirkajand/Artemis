databaseChangeLog:
  - changeSet:
      id: 001-create-local-students
      author: David Szczurek
      changes:
        - createTable:
            tableName: local_students
            columns:
              - column:
                  name: id
                  type: ${uuid_type}
                  constraints:
                    primaryKey: true
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: local_students
            baseColumnNames: id
            constraintName: fk_local_students_students
            referencedTableName: students
            referencedColumnNames: id
            onDelete: CASCADE
        - addColumn:
            tableName: local_students
            columns:
              - column:
                  name: assigned_students_capacity
                  type: integer