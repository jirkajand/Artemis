databaseChangeLog:
  - changeSet:
      id: 000-create-students
      author: David Szczurek
      changes:
        - createTable:
            tableName: students
            columns:
              - column:
                  name: id
                  type: ${uuid_type}
                  constraints:
                    primaryKey: true
              - column:
                  name: keycloak_id
                  type: ${uuid_type}
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: first_name
                  type: varchar(255)
              - column:
                  name: last_name
                  type: varchar(255)
              - column:
                  name: phone_number
                  type: varchar(32)
              - column:
                  name: gender
                  type: varchar(16)
              - column:
                  name: date_of_birth
                  type: date
              - column:
                  name: bio
                  type: varchar(1024)
              - column:
                  name: email_marketing_checked
                  type: boolean
              - column:
                  name: terms_and_conditions_checked
                  type: boolean
              - column:
                  name: created_at
                  type: timestamp with time zone
              - column:
                  name: updated_at
                  type: timestamp with time zone
              - column:
                  name: is_active
                  type: boolean
              - column:
                  name: account_status
                  type: varchar(32)
              - column:
                  name: faculty_id
                  type: ${uuid_type}
              - column:
                  name: profile_picture_path
                  type: varchar(1024)