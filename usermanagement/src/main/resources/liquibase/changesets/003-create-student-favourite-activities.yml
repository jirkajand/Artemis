databaseChangeLog:
  - changeSet:
      id: 003-create-student-favourite-activities
      author: David Szczurek
      changes:
        - createTable:
            tableName: student_favourite_activities
            columns:
              - column:
                  name: student_id
                  type: ${uuid_type}
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_student_fav_activities
                    nullable: false
              - column:
                  name: activity
                  type: varchar(255)
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_student_fav_activities
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: student_favourite_activities
            baseColumnNames: student_id
            constraintName: fk_student_favourite_activities_students
            referencedTableName: students
            referencedColumnNames: id
            onDelete: CASCADE
