openapi: 3.0.3
info:
  title: Artemis API
  version: 0.0.1
  description: Artemis API
servers: []
paths:
  /health:
    get:
      tags: [ SettingsService ]
      summary: healthCheck
      description: healthCheck endpoint to verify if the API is running
      operationId: getHealthCheck
      security: [ ]  # no auth required
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'

  /faculty:
    get:
      tags: [ SettingsService ]
      summary: getAllFaculties
      description: getAllFaculties endpoint to retrieve all faculties
      operationId: getAllFaculties
      security: [ ]
      responses:
        '200':
          description: List of all faculties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FacultyResponse'
    post:
      tags: [ SettingsService ]
      summary: createFaculty
      description: createFaculty endpoint to create a new faculty
      operationId: createFaculty
      security:
        - keycloak_auth: [ ADMIN ]
      x-security-roles:
        - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacultyCreateRequest'
      responses:
        '201':
          description: Faculty created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacultyResponse'
  /faculty/{id}:
    delete:
      tags: [ SettingsService ]
      summary: deleteFaculty
      description: deleteFaculty endpoint to delete a faculty by ID
      operationId: deleteFaculty
      security:
        - keycloak_auth: [ ADMIN ]
      x-security-roles:
        - ADMIN
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The UUID of the faculty to delete
      responses:
        '204':
          description: Faculty deleted successfully
        '404':
          description: Faculty not found
    get:
      tags: [ SettingsService ]
      summary: getFacultyById
      description: getFacultyById endpoint to retrieve a faculty by ID
      operationId: getFacultyById
      security:
        - keycloak_auth: [ USER, TUTOR, ADMIN ]
      x-security-roles:
        - ADMIN
        - TUTOR
        - USER
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Faculty details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacultyResponse'
        '404':
          description: Faculty not found
    put:
      tags: [ SettingsService ]
      summary: updateFaculty
      description: updateFaculty endpoint to update a faculty by ID
      operationId: updateFaculty
      security:
        - keycloak_auth: [ ADMIN ]
      x-security-roles:
        - ADMIN
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacultyCreateRequest'
      responses:
        '200':
          description: Faculty updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacultyResponse'
        '404':
          description: Faculty not found
  /semester:
    get:
      tags: [ SettingsService ]
      summary: getAllSemesters
      description: getAllSemesters endpoint to retrieve all semesters
      operationId: getAllSemesters
      security:
      - keycloak_auth: [ USER, TUTOR, ADMIN ]
      x-security-roles:
        - ADMIN
        - TUTOR
        - USER
      responses:
        '200':
          description: List of all semesters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SemesterResponse'
    post:
      tags: [ SettingsService ]
      summary: createSemester
      description: createSemester endpoint to create a semester by ID
      operationId: createSemester
      security:
        - keycloak_auth: [ ADMIN ]
      x-security-roles:
        - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SemesterCreateRequest'
      responses:
        '201':
          description: Semester created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemesterResponse'
  /semester/current:
    get:
      tags: [ SettingsService ]
      summary: getCurrentSemester
      description: getCurrentSemester endpoint to retrieve the current semester
      operationId: getCurrentSemester
      security:
        - keycloak_auth: [ USER, TUTOR, ADMIN ]
      x-security-roles:
        - ADMIN
        - TUTOR
        - USER
      responses:
        '200':
          description: Current semester details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemesterResponse'
        '404':
          description: Current semester not found
  /semester/{id}:
    get:
      tags: [ SettingsService ]
      summary: getSemesterById
      description: getSemesterById endpoint to retrieve a semester by ID
      operationId: getSemesterById
      security: [ ]
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Semester details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemesterResponse'
        '404':
          description: Semester not found
    put:
      tags: [ SettingsService ]
      summary: updateSemester
      description: updateSemester endpoint to update a semester by ID
      operationId: updateSemester
      security:
        - keycloak_auth: [ ADMIN ]
      x-security-roles:
        - ADMIN
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SemesterCreateRequest'
      responses:
        '200':
          description: Semester updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemesterResponse'
        '404':
          description: Semester not found

components:
  parameters:

    id:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
      description: The UUID of the faculty to retrieve
  schemas:
    HealthCheckResponse:
      type: object
      properties:
        status:
          type: string
          example: OK
    FacultyResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        facultyNameInternational:
          type: string
          example: "Faculty of informatics and management"
        facultyNameLocal:
          type: string
          example: "Fakulta informatiky a managementu"
        color:
          type: string
          example: "#FF5733"
        shortName:
          type: string
          example: "FIM"
    FacultyCreateRequest:
      type: object
      properties:
        facultyNameInternational:
          type: string
          example: "Faculty of informatics and management"
        facultyNameLocal:
          type: string
          example: "Fakulta informatiky a managementu"
        color:
          type: string
          example: "#FF5733"
        shortName:
          type: string
          example: "FIM"
    SemesterResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        semesterName:
          type: string
          example: "Winter Semester 2023/2024"
        semesterType:
          type: string
          example: "WINTER"
        year:
          type: string
          example: "2023/2024"
        semesterRegisterOpenDate:
          type: string
          format: date
          example: "2023-08-15"
    SemesterCreateRequest:
      type: object
      properties:
        semesterName:
          type: string
          example: "Winter Semester 2023/2024"
        semesterType:
          type: string
          example: "WINTER"
        year:
          type: string
          example: "2023/2024"
        semesterRegisterOpenDate:
          type: string
          format: date
          example: "2023-08-15"

  securitySchemes:
    keycloak_auth:
      type: oauth2
      description: OAuth2 flow via Keycloak
      flows:
        authorizationCode:
          authorizationUrl: https://keycloak.artemis.jirka.test.esnhk.cz/realms/Artemis/protocol/openid-connect/auth
          tokenUrl: https://keycloak.artemis.jirka.test.esnhk.cz/realms/Artemis/protocol/openid-connect/token
          scopes:
            ADMIN: Full administrative access
            USER: Standard user access
            TUTOR: Tutor-level access