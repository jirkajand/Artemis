openapi: 3.0.3
info:
  title: Artemis API
  version: 0.0.1
  description: Artemis API
servers:
  - url: /api
paths:
  /health:
    get:
      tags: [ UserManagement ]
      summary: healthCheck
      description: healthCheck endpoint to verify if the API is running
      operationId: getHealthCheck
      #security: []  # no auth required
      security:
        - keycloak_auth: [ TUTOR, ADMIN ]
      x-security-roles:
        - ADMIN
        - TUTOR
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'

  /local-student/register:
    post:
      tags: [ UserManagement ]
      summary: registerLocalStudent
      description: registerLocalStudent endpoint to register a new local student
      operationId: registerLocalStudent
      security: [ ]  # no auth required
      requestBody:
        description: Local student registration details
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterLocalStudentRequest'
      responses:
        '200':
          description: Student registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterLocalStudentResponse'

  /international-student/register:
    post:
      tags: [ UserManagement ]
      summary: registerInternationalStudent
      description: Register a new international student
      operationId: registerInternationalStudent
      requestBody:
        description: International student registration details
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInternationalStudentRequest'
      responses:
        '200':
          description: Student registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterInternationalStudentResponse'


components:
  schemas:
    HealthCheckResponse:
      type: object
      properties:
        status:
          type: string
          example: OK

    # A gender enum reused
    GenderEnum:
      type: string
      enum: [MALE, FEMALE, OTHER]

    # Common base schema for students
    StudentBase:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phoneNumber:
          type: string
          pattern: '^\+?[1-9]\d{1,14}$'
        bio:
          type: string
        favouriteActivities:
          type: array
          items:
            type: string
        profilePicturePath:
          type: string
        emailMarketingChecked:
          type: boolean

    # Local student registration schema
    RegisterLocalStudentRequest:
      allOf:
        - $ref: '#/components/schemas/StudentBase'
        - type: object
          properties:
            facultyId:
              type: string
            dateOfBirth:
              type: string
              format: date
            gender:
              $ref: '#/components/schemas/GenderEnum'
            termsAndConditionsChecked:
              type: boolean
            password:
              type: string
          required:
            - firstName
            - lastName
            - email
            - password
            - dateOfBirth
            - phoneNumber
            - gender
            - termsAndConditionsChecked
            - facultyId

    # International student registration schema
    RegisterInternationalStudentRequest:
      allOf:
        - $ref: '#/components/schemas/StudentBase'
        - type: object
          properties:
            countryISO:
              type: string
              pattern: '^[A-Z]{2}$'
            homeUniversity:
              type: string
            facultyId:
              type: string
            accommodationId:
              type: string
            dateOfBirth:
              type: string
              format: date
            gender:
              $ref: '#/components/schemas/GenderEnum'
            termsAndConditionsChecked:
              type: boolean
            password:
              type: string
          required:
            - firstName
            - lastName
            - email
            - password
            - dateOfBirth
            - phoneNumber
            - gender
            - termsAndConditionsChecked

    # Responses
    RegisterLocalStudentResponse:
      type: object
      properties:
        result:
          type: string
          example: Student registered successfully

    RegisterInternationalStudentResponse:
      type: object
      properties:
        result:
          type: string
          example: Student registered successfully

  securitySchemes:
    keycloak_auth:
      type: oauth2
      description: OAuth2 flow via Keycloak
      flows:
        authorizationCode:
          authorizationUrl: https://keycloak.artemis.jirka.test.esnhk.cz/realms/Artemis/protocol/openid-connect/auth
          tokenUrl: https://keycloak.artemis.jirka.test.esnhk.cz/realms/Artemis/protocol/openid-connect/token
          scopes:
            ADMIN: Full administrative access
            USER: Standard user access
            TUTOR: Tutor-level access
