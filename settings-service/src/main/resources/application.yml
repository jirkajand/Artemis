spring:
  application:
    name: settings-service
  profiles:
    active: default,kafka
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:settings_service_db}"
    username: "${DB_USER:admin}"
    password: "${DB_PASSWORD:secretpassword}"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: liquibase/changelog.yml
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "https://keycloak.artemis.jirka.test.esnhk.cz/realms/Artemis"
server:
  port: ${SERVER_PORT:8082}
